name: Package Blender Add-on
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: addon-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate sources and package public add-on only
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.4
          python tools/test_first_run.py
          python tools/test_find_animations.py
          python tools/package_addon.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RuriRipperImporter-Blender53
          path: |
            dist/RuriRipperImporter-Blender53.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
