name: Package Blender 5.2 Add-on
on:
  push:
    branches: [codex/blender-5.2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: addon-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate sources and provision pinned Windows CPython 3.13 bridge
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.4
          python -m unittest discover -s RuriRipperPyBridge/tests -t .
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps \
            --platform win_amd64 --python-version 3.13 --implementation cp --abi cp313 \
            --target dist/.python-runtime/cp313-win_amd64 \
            pythonnet==3.1.0 clr-loader==0.3.1 cffi==2.1.1 pycparser==3.0
          python tools/package_blender52.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RuriRipperImporter-Blender-5.2
          path: |
            dist/RuriRipperImporter-Blender-5.2.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
